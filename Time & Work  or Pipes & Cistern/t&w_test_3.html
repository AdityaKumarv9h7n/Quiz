<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time & Work / Pipes – Set 3</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--accent:#0ea5e9;--text:#e2e8f0;--correct:#16a34a;--wrong:#dc2626;--warning:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.header{background:#1e293b;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #334155;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.title{font-size:1.05rem;font-weight:700;color:var(--accent)}
.controls{display:flex;align-items:center;gap:10px}
.timer-box{background:var(--accent);color:#0f172a;font-weight:800;font-size:1.25rem;padding:6px 14px;border-radius:8px;min-width:70px;text-align:center}
.timer-box.warning{background:var(--warning)}
.timer-box.danger{background:var(--wrong);animation:pulse .7s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.btn-pause{background:#475569;color:#fff;border:none;padding:7px 14px;border-radius:6px;font-weight:600;cursor:pointer}
.progress{height:5px;background:#334155}
.progress-bar{height:100%;background:linear-gradient(90deg,#0ea5e9,#38bdf8);transition:width .3s}
.container{max-width:860px;margin:0 auto;padding:16px 12px 40px}
.card{background:var(--card);border-radius:14px;padding:22px 18px;box-shadow:0 8px 25px rgba(0,0,0,.35)}
.q-meta{color:#94a3b8;font-size:.85rem;margin-bottom:6px}
.question{font-size:1.08rem;margin-bottom:18px}
.hint-box{margin:12px 0}
.hint-box details{background:#334155;border-radius:8px;padding:10px 14px;cursor:pointer}
.hint-box summary{font-weight:600;color:#38bdf8}
.hint-content{margin-top:8px;font-size:.92rem;color:#cbd5e1}
.options{display:grid;gap:10px}
.option{background:#334155;border:2px solid transparent;padding:13px 15px;border-radius:10px;cursor:pointer;transition:.2s}
.option:hover{background:#475569;border-color:var(--accent)}
.option.selected{background:var(--accent);color:#0f172a;font-weight:600}
.option.correct{background:var(--correct)!important;color:#fff}
.option.incorrect{background:var(--wrong)!important;color:#fff}
.btn-row{margin-top:22px;display:flex;justify-content:flex-end}
button.action{padding:11px 24px;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.btn-next{background:var(--accent);color:#0f172a}
.btn-next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}
.score{font-size:2.8rem;font-weight:800;color:var(--accent);margin:12px 0}
.review{text-align:left;margin-top:28px}
.review-item{background:#334155;border-radius:10px;padding:14px;margin-bottom:12px;border-left:5px solid #64748b}
.review-item.correct{border-left-color:var(--correct)}
.review-item.incorrect{border-left-color:var(--wrong)}
.status{font-weight:700;margin-bottom:4px}
.status.correct{color:#4ade80}
.status.incorrect{color:#f87171}
.footer{text-align:center;padding:14px;color:#64748b;font-size:.8rem}
</style>
</head>
<body>
<div class="header">
  <div class="title">Time & Work / Pipes • Set 3</div>
  <div class="controls">
    <button class="btn-pause" id="pauseBtn" onclick="togglePause()">Pause</button>
    <div class="timer-box" id="timer">80</div>
  </div>
</div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="container"><div id="quizArea"></div></div>
<div class="footer">Options shuffled every load</div>

<script>
const allQuestions = [
  {q:"A can do a work in 16 days, B in 12 days. They work together for 4 days, then A leaves. B finishes remaining in:", options:["4 days","5 days","3 days","6 days"], answer:0, hint:"Work in 4 days + remaining by B", exp:"4 days"},
  {q:"8 men can complete a work in 20 days. After 5 days, 3 men left. Remaining work finished in:", options:["24 days","20 days","18 days","25 days"], answer:0, hint:"Work done + remaining by 5 men", exp:"24 days"},
  {q:"A is 40% more efficient than B. Together they finish a work in 15 days. A alone can finish it in:", options:["21 days","24 days","25 days","18 days"], answer:0, hint:"Efficiency ratio 7:5", exp:"≈21.4 ≈ 21 days (approx)"},
  {q:"Two pipes fill a tank in 8 hours and 12 hours. Both opened. After 2 hours the faster one closed. Remaining filled by slower in:", options:["7 hours","6 hours","5 hours","8 hours"], answer:0, hint:"Work in 2 hours + remaining by slower", exp:"7 hours"},
  {q:"A, B, C can do a work in 6, 9, 18 days. They work for 2 days, then C leaves. A and B finish remaining in:", options:["2 days","1.5 days","3 days","2.5 days"], answer:0, hint:"Work in 2 days + remaining rate", exp:"2 days"},
  {q:"A pipe fills a tank in 10 hours. Leak empties it in 15 hours. Both open, tank fills in:", options:["30 hours","25 hours","20 hours","35 hours"], answer:0, hint:"1/10 – 1/15 = 1/30", exp:"30 hours"},
  {q:"10 men can complete a work in 15 days. 15 women can complete it in 12 days. 5 men and 6 women will complete it in:", options:["12 days","10 days","15 days","9 days"], answer:0, hint:"Find combined rate of 5M+6W", exp:"12 days"},
  {q:"A and B can do a work in 12 days, B and C in 15 days, C and A in 20 days. Time taken by all three together:", options:["10 days","8 days","9 days","7.5 days"], answer:0, hint:"(A+B+C) = half of sum of pairs", exp:"10 days"},
  {q:"A tank has inlet pipe that fills in 4 hours and outlet that empties in 6 hours. If both opened, tank fills in:", options:["12 hours","10 hours","8 hours","14 hours"], answer:0, hint:"1/4 – 1/6", exp:"12 hours"},
  {q:"A can do a work in 8 days, B in 12 days. They start together. After 3 days B leaves. A finishes remaining in:", options:["2.5 days","3 days","2 days","4 days"], answer:0, hint:"Work in 3 days + remaining by A", exp:"2.5 days"},
  {q:"18 men working 6 hours/day complete a work in 10 days. How many men working 8 hours/day needed to complete in 9 days?", options:["15","12","18","20"], answer:0, hint:"M1D1H1 = M2D2H2", exp:"15 men"},
  {q:"Pipe A fills in 5 hours, B empties in 8 hours. Both opened for 3 hours, then B closed. Remaining filled by A in:", options:["1.75 hours","2 hours","1.5 hours","2.5 hours"], answer:0, hint:"Net work + remaining by A", exp:"1.75 hours"},
  {q:"A is thrice as efficient as B. Together they finish work in 12 days. A alone finishes in:", options:["16 days","18 days","15 days","20 days"], answer:0, hint:"Efficiency 3:1 → A takes 16 days", exp:"16 days"},
  {q:"Three pipes fill a tank in 12, 15, 20 hours. All opened. Time to fill 60% of tank:", options:["3 hours","2.5 hours","4 hours","3.5 hours"], answer:0, hint:"Combined rate × time = 0.6", exp:"3 hours"},
  {q:"A and B together do a work in 9 days. A alone in 15 days. B alone in:", options:["22.5 days","18 days","20 days","25 days"], answer:0, hint:"1/B = 1/9 – 1/15", exp:"22.5 days"},
  {q:"A tank filled by 3 pipes in 15, 20, 30 min. All opened. After 4 min the slowest closed. Remaining filled in:", options:["5.33 min","6 min","4.5 min","7 min"], answer:0, hint:"Work in 4 min + remaining by other two", exp:"≈5.33 min"},
  {q:"9 men or 15 women complete a work in 12 days. 6 men and 10 women will complete it in:", options:["9 days","8 days","10 days","12 days"], answer:0, hint:"Find 1 man + 1 woman, then combined", exp:"9 days"},
  {q:"A finishes work in 25 days. Works for 10 days and leaves. B finishes remaining in 12 days. B alone finishes whole work in:", options:["20 days","18 days","24 days","15 days"], answer:0, hint:"Work by A + B's rate", exp:"20 days"},
  {q:"Two pipes fill tank in 10 and 15 hours. Due to leak it takes 1 hour extra when both open. Leak empties full tank in:", options:["30 hours","25 hours","20 hours","40 hours"], answer:0, hint:"Find leak rate from extra time", exp:"30 hours"},
  {q:"A, B, C do work in 12, 18, 36 days. Start together. After 3 days A leaves. Remaining finished by B+C in:", options:["6 days","4.5 days","5 days","7 days"], answer:0, hint:"Work in 3 days + remaining by B+C", exp:"6 days"}
];

let questions=[],current=0,score=0,userAnswers=[],timerInterval=null,timeLeft=80,isPaused=false;
const quizArea=document.getElementById('quizArea'),timerEl=document.getElementById('timer'),progressBar=document.getElementById('progressBar'),pauseBtn=document.getElementById('pauseBtn');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffleQuestionOptions(question){const correctText=question.options[question.answer];const optionIndices=shuffle(question.options.map((_,i)=>i));const newOptions=optionIndices.map(i=>question.options[i]);const newAnswer=newOptions.indexOf(correctText);return{...question,options:newOptions,answer:newAnswer}}
function startQuiz(){const shuffledQuestions=shuffle([...allQuestions]);questions=shuffledQuestions.map(shuffleQuestionOptions);current=0;score=0;userAnswers=[];loadQuestion()}
function startTimer(){timeLeft=80;timerEl.textContent=timeLeft;timerEl.className='timer-box';clearInterval(timerInterval);timerInterval=setInterval(()=>{if(isPaused)return;timeLeft--;timerEl.textContent=timeLeft;if(timeLeft<=15)timerEl.classList.add('danger');else if(timeLeft<=30)timerEl.classList.add('warning');if(timeLeft<=0){clearInterval(timerInterval);selectOption(-1);setTimeout(nextQuestion,700)}},1000)}
function togglePause(){isPaused=!isPaused;pauseBtn.textContent=isPaused?'Resume':'Pause'}
function loadQuestion(){if(current>=questions.length){showResult();return}const q=questions[current];progressBar.style.width=(current/questions.length*100)+'%';let hintHTML=q.hint?`<div class="hint-box"><details><summary>💡 Formula / Hint</summary><div class="hint-content">${q.hint}</div></details></div>`:'';quizArea.innerHTML=`<div class="card"><div class="q-meta">Question ${current+1} of ${questions.length}</div><div class="question">${q.q}</div>${hintHTML}<div class="options">${q.options.map((opt,i)=>`<div class="option" onclick="selectOption(${i})" id="opt${i}">${String.fromCharCode(97+i)}) ${opt}</div>`).join('')}</div><div class="btn-row"><button class="action btn-next" id="nextBtn" disabled onclick="nextQuestion()">Next →</button></div></div>`;startTimer();isPaused=false;pauseBtn.textContent='Pause'}
function selectOption(idx){if(userAnswers[current]!==undefined)return;userAnswers[current]=idx;clearInterval(timerInterval);const q=questions[current];document.querySelectorAll('.option').forEach((el,i)=>{el.style.pointerEvents='none';if(i===q.answer)el.classList.add('correct');if(i===idx&&idx!==q.answer)el.classList.add('incorrect');if(i===idx)el.classList.add('selected')});if(idx===q.answer)score++;document.getElementById('nextBtn').disabled=false}
function nextQuestion(){current++;loadQuestion()}
function showResult(){clearInterval(timerInterval);progressBar.style.width='100%';timerEl.textContent='✓';timerEl.className='timer-box';let reviewHTML='';questions.forEach((q,i)=>{const ua=userAnswers[i];const isCorrect=ua===q.answer;reviewHTML+=`<div class="review-item ${isCorrect?'correct':'incorrect'}"><div class="status ${isCorrect?'correct':'incorrect'}">${isCorrect?'✓ Correct':'✗ Incorrect'}</div><div><strong>Q${i+1}.</strong> ${q.q}</div><div style="margin-top:6px">Your answer: <em>${ua===-1||ua===undefined?'Timed out':q.options[ua]}</em></div><div>Correct: <strong>${q.options[q.answer]}</strong></div><div style="font-size:.88rem;color:#94a3b8;margin-top:4px">${q.exp||''}</div></div>`});quizArea.innerHTML=`<div class="card result"><h2>Set 3 Completed!</h2><div class="score">${score}/${questions.length}</div><p>${Math.round(score/questions.length*100)}%</p><div class="review"><h3>Detailed Review</h3>${reviewHTML}</div><button class="action btn-next" style="margin-top:24px" onclick="location.reload()">🔄 Restart</button></div>`}
startQuiz();
</script>
</body>
</html>
