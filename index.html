<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Hub</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --bg-gradient: radial-gradient(135% 100% at 50% 0%, #F5F7F6 0%, #E8ECEB 100%);
      --card-bg: rgba(255, 255, 255, 0.82);
      --card-border: rgba(255, 255, 255, 0.9);
      --text-main: #1C2B26;
      --text-muted: #72807A;
      --item-bg: #F0F4F2;
      --item-border: rgba(200, 212, 206, 0.5);
      --item-hover-bg: #FFFFFF;
      --accent: #3B6B5E;
      --accent-light: #E2ECE8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 1.25rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 2.5rem 2rem;
      border-radius: 28px;
      box-shadow: 
        0 30px 60px -20px rgba(28, 43, 38, 0.08),
        0 1px 0px rgba(255, 255, 255, 0.8) inset;
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 460px;
    }

    .header {
      text-align: center;
      margin-bottom: 2.25rem;
    }

    .tag {
      display: inline-block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--accent);
      background: var(--accent-light);
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.025em;
    }

    .sections-wrapper {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      padding: 0 0.25rem;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .count-badge {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.04);
      padding: 0.15rem 0.5rem;
      border-radius: 12px;
    }

    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.625rem;
    }

    .quiz-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1rem;
      background: var(--item-bg);
      color: var(--text-main);
      text-decoration: none;
      border-radius: 14px;
      font-size: 0.875rem;
      font-weight: 600;
      border: 1px solid var(--item-border);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .quiz-link:hover {
      background: var(--item-hover-bg);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -8px rgba(59, 107, 94, 0.15);
    }

    .quiz-link::after {
      content: "→";
      font-size: 0.85rem;
      opacity: 0.3;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .quiz-link:hover::after {
      opacity: 1;
      transform: translateX(3px);
    }
  </style>
</head>
<body>

  <main class="card">
    <header class="header">
      <span class="tag">Dashboard</span>
      <h1>Select Assessment</h1>
    </header>

    <div class="sections-wrapper">
      
      <section>
        <div class="section-header">
          <span class="section-title">Mensuration</span>
          <span class="count-badge">2 Tests</span>
        </div>
        <div class="quiz-grid">
          <a href="mensuration.html" class="quiz-link">Test 1</a>
          <a href="mensurationquiz1.html" class="quiz-link">Test 2</a>
        </div>
      </section>

      <section>
        <div class="section-header">
          <span class="section-title">Profit & Loss</span>
          <span class="count-badge">4 Tests</span>
        </div>
        <div class="quiz-grid">
          <a href="profit and loss/p&l_test_1.html" class="quiz-link">Test 1</a>
          <a href="profit and loss/p&l_test_2.html" class="quiz-link">Test 2</a>
          <a href="profit and loss/p&l_test_3.html" class="quiz-link">Test 3</a>
          <a href="profit and loss/p&l_test_4.html" class="quiz-link">Test 4</a>
        </div>
      </section>

      <section>
        <div class="section-header">
          <span class="section-title">Time & Work / Pipes</span>
          <span class="count-badge">4 Tests</span>
        </div>
        <div class="quiz-grid">
          <a href="Time & Work  or Pipes & Cistern/t&w_test_1.html" class="quiz-link">Test 1</a>
          <a href="Time & Work  or Pipes & Cistern/t&w_test_2.html" class="quiz-link">Test 2</a>
          <a href="Time & Work  or Pipes & Cistern/t&w_test_3.html" class="quiz-link">Test 3</a>
          <a href="Time & Work  or Pipes & Cistern/t&w_test_4.html" class="quiz-link">Test 4</a>
        </div>
      </section>

      <section>
        <div class="section-header">
          <span class="section-title">Simple & Compound Interest</span>
          <span class="count-badge">4 Tests</span>
        </div>
        <div class="quiz-grid">
          <a href="Simple & Compound Interest/si&ci_test_1.html" class="quiz-link">Test 1</a>
          <a href="Simple & Compound Interest/si&ci_test_2.html" class="quiz-link">Test 2</a>
          <a href="Simple & Compound Interest/si&ci_test_3.html" class="quiz-link">Test 3</a>
          <a href="Simple & Compound Interest/si&ci_test_4.html" class="quiz-link">Test 4</a>
        </div>
      </section>

    </div>
  </main>

</body>
</html>
