<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Hub</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      /* Premium Dark & Purple Accent Palette */
      --bg-dark: #0B0A10;
      --card-bg: rgba(22, 20, 31, 0.65);
      --card-border: rgba(255, 255, 255, 0.1);
      
      --text-main: #F1EFFA;
      --text-muted: #A39EB5;
      
      --accent-purple: #9D7BFF;
      --accent-pink: #E58CFF;
      --accent-glow: rgba(157, 123, 255, 0.25);
      
      --item-bg: rgba(255, 255, 255, 0.04);
      --item-border: rgba(255, 255, 255, 0.07);
      --item-hover-bg: rgba(157, 123, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 1.25rem;
      position: relative;
      overflow-x: hidden;
    }

    /* --- Animated Ambient Glows --- */
    .glow-1, .glow-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
      animation: floatGlow 12s infinite alternate ease-in-out;
    }

    .glow-1 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(157, 123, 255, 0.25) 0%, rgba(0,0,0,0) 70%);
      top: 10%;
      left: 15%;
    }

    .glow-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(229, 140, 255, 0.18) 0%, rgba(0,0,0,0) 70%);
      bottom: 10%;
      right: 15%;
      animation-delay: -6s;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.1); }
    }

    /* --- Animated Background Doodles --- */
    .bg-doodles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .doodle {
      position: absolute;
      stroke: rgba(255, 255, 255, 0.08);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: floatDoodle 15s infinite ease-in-out alternate;
    }

    .doodle-1 { top: 12%; left: 8%; width: 64px; animation-duration: 14s; }
    .doodle-2 { top: 25%; right: 10%; width: 72px; animation-duration: 18s; animation-delay: -3s; }
    .doodle-3 { bottom: 18%; left: 10%; width: 80px; animation-duration: 16s; animation-delay: -5s; }
    .doodle-4 { bottom: 15%; right: 12%; width: 60px; animation-duration: 20s; animation-delay: -8s; }

    @keyframes floatDoodle {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-25px) rotate(10deg); }
    }

    /* --- Main Glass Card Container --- */
    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 2.75rem 2.25rem;
      border-radius: 32px;
      box-shadow: 
        0 30px 80px -20px rgba(0, 0, 0, 0.6),
        0 0 0 1px var(--card-border) inset,
        0 1px 0 0 rgba(255, 255, 255, 0.15) inset;
      width: 100%;
      max-width: 480px;
      animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* --- Header --- */
    .header {
      text-align: center;
      margin-bottom: 2.25rem;
    }

    .tag {
      display: inline-block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--accent-purple);
      background: rgba(157, 123, 255, 0.12);
      border: 1px solid rgba(157, 123, 255, 0.25);
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      font-weight: 700;
      margin-bottom: 0.85rem;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #FFFFFF 0%, #C4B8E5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* --- Sections Layout --- */
    .sections-wrapper {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      padding: 0 0.25rem;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .count-badge {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent-pink);
      background: rgba(229, 140, 255, 0.1);
      border: 1px solid rgba(229, 140, 255, 0.2);
      padding: 0.15rem 0.55rem;
      border-radius: 12px;
    }

    /* --- Quiz Grid & Links --- */
    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.65rem;
    }

    .quiz-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.95rem 1.1rem;
      background: var(--item-bg);
      color: var(--text-main);
      text-decoration: none;
      border-radius: 16px;
      font-size: 0.875rem;
      font-weight: 600;
      border: 1px solid var(--item-border);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .quiz-link::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    .quiz-link:hover::before {
      transform: translateX(100%);
    }

    .quiz-link:hover {
      background: var(--item-hover-bg);
      border-color: rgba(157, 123, 255, 0.4);
      color: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 
        0 8px 20px -6px rgba(157, 123, 255, 0.3),
        0 0 0 1px rgba(157, 123, 255, 0.2) inset;
    }

    .quiz-link::after {
      content: "→";
      font-size: 0.85rem;
      color: var(--accent-purple);
      opacity: 0.5;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .quiz-link:hover::after {
      opacity: 1;
      transform: translateX(3px);
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Effects -->
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <!-- Background SVG Doodles -->
  <div class="bg-doodles">
    <!-- Math Compass / Angle Doodle -->
    <svg class="doodle doodle-1" viewBox="0 0 24 24">
      <path d="M12 3v4m0 0l-4 13m4-13l4 13M8 17h8M12 7a2 2 0 100-4 2 2 0 000 4z" />
    </svg>
    <!-- Math / Percentage Symbol -->
    <svg class="doodle doodle-2" viewBox="0 0 24 24">
      <path d="M19 5L5 19M7.5 7a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zm12 10a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z" />
    </svg>
    <!-- Clock Doodle for Time & Work -->
    <svg class="doodle doodle-3" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3 3" />
    </svg>
    <!-- Sparkles / Star Doodle -->
    <svg class="doodle doodle-4" viewBox="0 0 24 24">
      <path d="M12 2l2.4 7.2H22l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z" />
    </svg>
  </div>

  <!-- Main Card -->
  <main class="card">
    <header class="header">
      <span class="tag">Portal</span>
      <h1>Select Assessment</h1>
    </header>

    <div class="sections-wrapper">
      
      <!-- Mensuration -->
      <section>
        <div class="section-header">
          <span class="section-title">Mensuration</span>
          <span class="count-badge">2 Tests</span>
        </div>
        <div class="quiz-grid">
          <a href="mensuration.html" class="quiz-link">Test 1</a>
          <a href="mensurationquiz1.html" class="quiz-link">Test 2</a>
        </div>
      </section>

      <!-- Profit & Loss -->
      <section>
        <div class="section-header">
          <span class="section-title">Profit & Loss</span>
          <span class="count-badge">4 Tests</span>
        </div>
        <div class="quiz-grid">
          <a href="profit and loss/p&l_test_1.html" class="quiz-link">Test 1</a>
          <a href="profit and loss/p&l_test_2.html" class="quiz-link">Test 2</a>
          <a href="profit and loss/p&l_test_3.html" class="quiz-link">Test 3</a>
          <a href="profit and loss/p&l_test_4.html" class="quiz-link">Test 4</a>
        </div>
      </section>

      <!-- Time & Work -->
      <section>
        <div class="section-header">
          <span class="section-title">Time & Work / Pipes</span>
          <span class="count-badge">4 Tests</span>
        </div>
        <div class="quiz-grid">
          <a href="Time & Work  or Pipes & Cistern/t&w_test_1.html" class="quiz-link">Test 1</a>
          <a href="Time & Work  or Pipes & Cistern/t&w_test_2.html" class="quiz-link">Test 2</a>
          <a href="Time & Work  or Pipes & Cistern/t&w_test_3.html" class="quiz-link">Test 3</a>
          <a href="Time & Work  or Pipes & Cistern/t&w_test_4.html" class="quiz-link">Test 4</a>
        </div>
      </section>

      <!-- SI & CI -->
      <section>
        <div class="section-header">
          <span class="section-title">Simple & Compound Interest</span>
          <span class="count-badge">4 Tests</span>
        </div>
        <div class="quiz-grid">
          <a href="Simple & Compound Interest/si&ci_test_1.html" class="quiz-link">Test 1</a>
          <a href="Simple & Compound Interest/si&ci_test_2.html" class="quiz-link">Test 2</a>
          <a href="Simple & Compound Interest/si&ci_test_3.html" class="quiz-link">Test 3</a>
          <a href="Simple & Compound Interest/si&ci_test_4.html" class="quiz-link">Test 4</a>
        </div>
      </section>

    </div>
  </main>

</body>
</html>
