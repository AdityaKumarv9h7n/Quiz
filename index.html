<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(120% 120% at 50% 0%, #FAF8F5 0%, #F2EFE9 100%);
      color: #2D2B2A;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 2.5rem 2rem;
      border-radius: 24px;
      box-shadow: 
        0 20px 40px -15px rgba(180, 170, 160, 0.15),
        0 1px 1px rgba(255, 255, 255, 0.8) inset;
      border: 1px solid rgba(255, 255, 255, 0.8);
      width: 100%;
      max-width: 420px;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .subtitle {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #9C948B;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      color: #2D2B2A;
      letter-spacing: -0.02em;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: #8C847B;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 1.5rem 0 0.75rem 0.25rem;
    }

    .section-title:first-of-type {
      margin-top: 0;
    }

    .quiz-list {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }

    .quiz-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.15rem;
      background: #FAF8F5;
      color: #4A4643;
      text-decoration: none;
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: 500;
      border: 1px solid rgba(220, 214, 206, 0.5);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .quiz-link:hover {
      background: #FFFFFF;
      color: #1A1918;
      border-color: #D1C8BC;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -6px rgba(160, 150, 140, 0.12);
    }

    .quiz-link::after {
      content: "→";
      font-size: 0.95rem;
      opacity: 0.4;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .quiz-link:hover::after {
      opacity: 1;
      transform: translateX(3px);
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="header">
      <p class="subtitle">Overview</p>
      <h1>Select Assessment</h1>
    </div>
    
    <div class="section-title">Mensuration</div>
    <div class="quiz-list">
      <a href="mensuration.html" class="quiz-link">Test 1</a>
      <a href="mensurationquiz1.html" class="quiz-link">Test 2</a>
    </div>

    <div class="section-title">Profit & Loss</div>
    <div class="quiz-list">
      <a href="profit and loss/p&l_test_1.html" class="quiz-link">Test 1</a>
      <a href="profit and loss/p&l_test_2.html" class="quiz-link">Test 2</a>
      <a href="profit and loss/p&l_test_3.html" class="quiz-link">Test 3</a>
      <a href="profit and loss/p&l_test_4.html" class="quiz-link">Test 4</a>
    </div>

    <div class="section-title">Time & Work / Pipes & Cistern</div>
    <div class="quiz-list">
      <a href="Time & Work  or Pipes & Cistern/t&w_test_1.html" class="quiz-link">Test 1</a>
      <a href="Time & Work  or Pipes & Cistern/t&w_test_2.html" class="quiz-link">Test 2</a>
      <a href="Time & Work  or Pipes & Cistern/t&w_test_3.html" class="quiz-link">Test 3</a>
      <a href="Time & Work  or Pipes & Cistern/t&w_test_4.html" class="quiz-link">Test 4</a>
    </div>

    <div class="section-title">Simple & Compound Interest</div>
    <div class="quiz-list">
      <a href="Simple & Compound Interest/si&ci_test_1.html" class="quiz-link">Test 1</a>
      <a href="Simple & Compound Interest/si&ci_test_2.html" class="quiz-link">Test 2</a>
      <a href="Simple & Compound Interest/si&ci_test_3.html" class="quiz-link">Test 3</a>
      <a href="Simple & Compound Interest/si&ci_test_4.html" class="quiz-link">Test 4</a>
    </div>
  </main>

</body>
</html>
