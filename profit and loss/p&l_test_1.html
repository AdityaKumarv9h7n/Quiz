<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profit Loss & Discount – Set 1 (Fixed)</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--accent:#0ea5e9;--text:#e2e8f0;--correct:#16a34a;--wrong:#dc2626;--warning:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.header{background:#1e293b;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #334155;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.title{font-size:1.05rem;font-weight:700;color:var(--accent)}
.controls{display:flex;align-items:center;gap:10px}
.timer-box{background:var(--accent);color:#0f172a;font-weight:800;font-size:1.25rem;padding:6px 14px;border-radius:8px;min-width:70px;text-align:center}
.timer-box.warning{background:var(--warning)}
.timer-box.danger{background:var(--wrong);animation:pulse .7s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.btn-pause{background:#475569;color:#fff;border:none;padding:7px 14px;border-radius:6px;font-weight:600;cursor:pointer}
.progress{height:5px;background:#334155}
.progress-bar{height:100%;background:linear-gradient(90deg,#0ea5e9,#38bdf8);transition:width .3s}
.container{max-width:860px;margin:0 auto;padding:16px 12px 40px}
.card{background:var(--card);border-radius:14px;padding:22px 18px;box-shadow:0 8px 25px rgba(0,0,0,.35)}
.q-meta{color:#94a3b8;font-size:.85rem;margin-bottom:6px}
.question{font-size:1.08rem;margin-bottom:18px}
.hint-box{margin:12px 0}
.hint-box details{background:#334155;border-radius:8px;padding:10px 14px;cursor:pointer}
.hint-box summary{font-weight:600;color:#38bdf8}
.hint-content{margin-top:8px;font-size:.92rem;color:#cbd5e1}
.options{display:grid;gap:10px}
.option{background:#334155;border:2px solid transparent;padding:13px 15px;border-radius:10px;cursor:pointer;transition:.2s}
.option:hover{background:#475569;border-color:var(--accent)}
.option.selected{background:var(--accent);color:#0f172a;font-weight:600}
.option.correct{background:var(--correct)!important;color:#fff}
.option.incorrect{background:var(--wrong)!important;color:#fff}
.btn-row{margin-top:22px;display:flex;justify-content:flex-end}
button.action{padding:11px 24px;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.btn-next{background:var(--accent);color:#0f172a}
.btn-next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}
.score{font-size:2.8rem;font-weight:800;color:var(--accent);margin:12px 0}
.review{text-align:left;margin-top:28px}
.review-item{background:#334155;border-radius:10px;padding:14px;margin-bottom:12px;border-left:5px solid #64748b}
.review-item.correct{border-left-color:var(--correct)}
.review-item.incorrect{border-left-color:var(--wrong)}
.status{font-weight:700;margin-bottom:4px}
.status.correct{color:#4ade80}
.status.incorrect{color:#f87171}
.footer{text-align:center;padding:14px;color:#64748b;font-size:.8rem}
</style>
</head>
<body>
<div class="header">
  <div class="title">Profit, Loss & Discount • Set 1 (Fixed)</div>
  <div class="controls">
    <button class="btn-pause" id="pauseBtn" onclick="togglePause()">Pause</button>
    <div class="timer-box" id="timer">80</div>
  </div>
</div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="container"><div id="quizArea"></div></div>
<div class="footer">Correct answers randomly placed • No more always option A</div>

<script>
const allQuestions = [
  {q:"A sold a watch to B at a profit of 20%. B sold it to C at 30% profit. C sold it to D at 10% loss. If B's profit is Rs.80 more than that of A, then D bought it for:", options:["Rs.680","Rs.702","Rs.700","Rs.652"], answer:2, hint:"Let CP of A = x. Successive calculation.", exp:"x=500 → Final SP to D = 702"},
  {q:"Remi earns a profit of 20% on selling an article at a certain price. If she sells it for Rs.8 more, she gains 30%. Cost price of 16 such articles is:", options:["Rs.1120","Rs.1280","Rs.1152","Rs.1200"], answer:1, hint:"10% of CP = Rs.8", exp:"CP of one = 80 → 16 articles = 1280"},
  {q:"Marked price is 40% above cost price. Selling price is 73% of marked price. Profit percent is:", options:["2%","1.8%","2.2%","2.5%"], answer:2, hint:"CP=100 → MP=140 → SP=102.2", exp:"2.2%"},
  {q:"An article is marked 35% above cost. Profit of 20% is earned. Discount percent on marked price is:", options:["10%","11.11%","12.5%","15%"], answer:1, hint:"CP=100, MP=135, SP=120", exp:"≈11.11%"},
  {q:"Shopkeeper allows 20% discount on marked price. Without discount he would earn 20% profit. If MP = Rs.1200, CP is:", options:["Rs.1000","Rs.960","Rs.900","Rs.800"], answer:0, hint:"MP = 1.2 × CP", exp:"CP = 1000"},
  {q:"Trader buys 40 articles for Rs.2400. Sells 20 at 20% profit and 20 at 10% loss. Overall result:", options:["5% loss","2.5% profit","5% profit","2.5% loss"], answer:2, hint:"Total SP calculation", exp:"5% profit"},
  {q:"By selling for Rs.1440 a man loses 10%. To gain 10% he should sell at:", options:["Rs.1720","Rs.1760","Rs.1800","Rs.1680"], answer:1, hint:"CP = 1600", exp:"Rs.1760"},
  {q:"Man buys article for Rs.800, sells at 12% loss. Buys another for Rs.800, sells at 12% profit. Overall:", options:["No profit no loss","Loss of Rs.11.52","Profit of Rs.11.52","Loss of Rs.23.04"], answer:1, hint:"(12% of 12% of 800)", exp:"Loss of Rs.11.52"},
  {q:"CP of 12 articles = SP of 10 articles. Profit percent is:", options:["20%","25%","15%","10%"], answer:0, hint:"Profit on 10 = CP of 2", exp:"20%"},
  {q:"Dishonest dealer uses 900 g weight instead of 1 kg but claims to sell at CP. Gain % is:", options:["10%","11.11%","9.09%","12.5%"], answer:1, hint:"(Error / True – Error) × 100", exp:"≈11.11%"},
  {q:"Successive discounts of 20% and 10% equal single discount of:", options:["30%","28%","25%","22%"], answer:1, hint:"a+b–ab/100", exp:"28%"},
  {q:"Marks goods 40% above CP and allows 25% discount. Profit % is:", options:["15%","10%","5%","8%"], answer:2, hint:"CP=100, MP=140, SP=105", exp:"5%"},
  {q:"By selling 45 m cloth, merchant gains CP of 15 m. Gain % is:", options:["33.33%","25%","50%","20%"], answer:0, hint:"15/45 × 100", exp:"33.33%"},
  {q:"Sold two articles for Rs.2400 each. One at 20% profit, other at 20% loss. Overall:", options:["No profit no loss","Loss of Rs.100","Profit of Rs.100","Loss of Rs.200"], answer:1, hint:"(p²/100)% loss", exp:"Loss of Rs.100"},
  {q:"CP is 80% of SP. Profit percent is:", options:["20%","25%","15%","30%"], answer:1, hint:"CP=80, SP=100", exp:"25%"},
  {q:"A sells to B at 20% profit. B sells to C at 25% profit. C pays Rs.1800. CP for A is:", options:["Rs.1250","Rs.1200","Rs.1300","Rs.1350"], answer:1, hint:"1800 = 1.25 × 1.2 × CP", exp:"Rs.1200"},
  {q:"Bought 50 pens at Rs.10 each. Sold 40 at Rs.12 and remaining at Rs.8. Overall profit %:", options:["12%","8%","10%","15%"], answer:0, hint:"Total CP=500, Total SP=560", exp:"12%"},
  {q:"Sells at 5% profit instead of 5% loss and gets Rs.40 more. CP is:", options:["Rs.400","Rs.500","Rs.450","Rs.480"], answer:0, hint:"10% of CP = 40", exp:"Rs.400"},
  {q:"Allows 15% discount and still makes 19% profit. How much % above CP must he mark?", options:["35%","40%","30%","25%"], answer:1, hint:"85% of MP = 119% of CP", exp:"40%"},
  {q:"Ratio of CP : SP = 5 : 6. Profit percent is:", options:["20%","25%","15%","16.67%"], answer:0, hint:"1 part profit on 5 parts", exp:"20%"}
];

let questions=[],current=0,score=0,userAnswers=[],timerInterval=null,timeLeft=80,isPaused=false;
const quizArea=document.getElementById('quizArea'),timerEl=document.getElementById('timer'),progressBar=document.getElementById('progressBar'),pauseBtn=document.getElementById('pauseBtn');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(){questions=shuffle([...allQuestions]);current=0;score=0;userAnswers=[];loadQuestion()}
function startTimer(){timeLeft=80;timerEl.textContent=timeLeft;timerEl.className='timer-box';clearInterval(timerInterval);timerInterval=setInterval(()=>{if(isPaused)return;timeLeft--;timerEl.textContent=timeLeft;if(timeLeft<=15)timerEl.classList.add('danger');else if(timeLeft<=30)timerEl.classList.add('warning');if(timeLeft<=0){clearInterval(timerInterval);selectOption(-1);setTimeout(nextQuestion,700)}},1000)}
function togglePause(){isPaused=!isPaused;pauseBtn.textContent=isPaused?'Resume':'Pause'}
function loadQuestion(){if(current>=questions.length){showResult();return}const q=questions[current];progressBar.style.width=(current/questions.length*100)+'%';let hintHTML=q.hint?`<div class="hint-box"><details><summary>💡 Formula / Hint</summary><div class="hint-content">${q.hint}</div></details></div>`:'';quizArea.innerHTML=`<div class="card"><div class="q-meta">Question ${current+1} of ${questions.length}</div><div class="question">${q.q}</div>${hintHTML}<div class="options">${q.options.map((opt,i)=>`<div class="option" onclick="selectOption(${i})" id="opt${i}">${String.fromCharCode(97+i)}) ${opt}</div>`).join('')}</div><div class="btn-row"><button class="action btn-next" id="nextBtn" disabled onclick="nextQuestion()">Next →</button></div></div>`;startTimer();isPaused=false;pauseBtn.textContent='Pause'}
function selectOption(idx){if(userAnswers[current]!==undefined)return;userAnswers[current]=idx;clearInterval(timerInterval);const q=questions[current];document.querySelectorAll('.option').forEach((el,i)=>{el.style.pointerEvents='none';if(i===q.answer)el.classList.add('correct');if(i===idx&&idx!==q.answer)el.classList.add('incorrect');if(i===idx)el.classList.add('selected')});if(idx===q.answer)score++;document.getElementById('nextBtn').disabled=false}
function nextQuestion(){current++;loadQuestion()}
function showResult(){clearInterval(timerInterval);progressBar.style.width='100%';timerEl.textContent='✓';timerEl.className='timer-box';let reviewHTML='';questions.forEach((q,i)=>{const ua=userAnswers[i];const isCorrect=ua===q.answer;reviewHTML+=`<div class="review-item ${isCorrect?'correct':'incorrect'}"><div class="status ${isCorrect?'correct':'incorrect'}">${isCorrect?'✓ Correct':'✗ Incorrect'}</div><div><strong>Q${i+1}.</strong> ${q.q}</div><div style="margin-top:6px">Your answer: <em>${ua===-1||ua===undefined?'Timed out':q.options[ua]}</em></div><div>Correct: <strong>${q.options[q.answer]}</strong></div><div style="font-size:.88rem;color:#94a3b8;margin-top:4px">${q.exp||''}</div></div>`});quizArea.innerHTML=`<div class="card result"><h2>Set 1 Completed!</h2><div class="score">${score}/${questions.length}</div><p>${Math.round(score/questions.length*100)}%</p><div class="review"><h3>Detailed Review</h3>${reviewHTML}</div><button class="action btn-next" style="margin-top:24px" onclick="location.reload()">🔄 Restart</button></div>`}
startQuiz();
</script>
</body>
</html>
