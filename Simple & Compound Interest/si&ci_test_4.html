<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple & Compound Interest – Set 4</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--accent:#0ea5e9;--text:#e2e8f0;--correct:#16a34a;--wrong:#dc2626;--warning:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.header{background:#1e293b;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #334155;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.title{font-size:1.05rem;font-weight:700;color:var(--accent)}
.controls{display:flex;align-items:center;gap:10px}
.timer-box{background:var(--accent);color:#0f172a;font-weight:800;font-size:1.25rem;padding:6px 14px;border-radius:8px;min-width:70px;text-align:center}
.timer-box.warning{background:var(--warning)}
.timer-box.danger{background:var(--wrong);animation:pulse .7s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.btn-pause{background:#475569;color:#fff;border:none;padding:7px 14px;border-radius:6px;font-weight:600;cursor:pointer}
.progress{height:5px;background:#334155}
.progress-bar{height:100%;background:linear-gradient(90deg,#0ea5e9,#38bdf8);transition:width .3s}
.container{max-width:860px;margin:0 auto;padding:16px 12px 40px}
.card{background:var(--card);border-radius:14px;padding:22px 18px;box-shadow:0 8px 25px rgba(0,0,0,.35)}
.q-meta{color:#94a3b8;font-size:.85rem;margin-bottom:6px}
.question{font-size:1.08rem;margin-bottom:18px}
.hint-box{margin:12px 0}
.hint-box details{background:#334155;border-radius:8px;padding:10px 14px;cursor:pointer}
.hint-box summary{font-weight:600;color:#38bdf8}
.hint-content{margin-top:8px;font-size:.92rem;color:#cbd5e1}
.options{display:grid;gap:10px}
.option{background:#334155;border:2px solid transparent;padding:13px 15px;border-radius:10px;cursor:pointer;transition:.2s}
.option:hover{background:#475569;border-color:var(--accent)}
.option.selected{background:var(--accent);color:#0f172a;font-weight:600}
.option.correct{background:var(--correct)!important;color:#fff}
.option.incorrect{background:var(--wrong)!important;color:#fff}
.btn-row{margin-top:22px;display:flex;justify-content:flex-end}
button.action{padding:11px 24px;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.btn-next{background:var(--accent);color:#0f172a}
.btn-next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}
.score{font-size:2.8rem;font-weight:800;color:var(--accent);margin:12px 0}
.review{text-align:left;margin-top:28px}
.review-item{background:#334155;border-radius:10px;padding:14px;margin-bottom:12px;border-left:5px solid #64748b}
.review-item.correct{border-left-color:var(--correct)}
.review-item.incorrect{border-left-color:var(--wrong)}
.status{font-weight:700;margin-bottom:4px}
.status.correct{color:#4ade80}
.status.incorrect{color:#f87171}
.footer{text-align:center;padding:14px;color:#64748b;font-size:.8rem}
</style>
</head>
<body>
<div class="header">
  <div class="title">Simple & Compound Interest • Set 4</div>
  <div class="controls">
    <button class="btn-pause" id="pauseBtn" onclick="togglePause()">Pause</button>
    <div class="timer-box" id="timer">80</div>
  </div>
</div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="container"><div id="quizArea"></div></div>
<div class="footer">Final set of this chapter • Options shuffled</div>

<script>
const allQuestions = [
  {q:"SI on Rs.4800 at 6% for 5 years is:", options:["Rs.1440","Rs.1200","Rs.1500","Rs.1600"], answer:0, hint:"PRT/100", exp:"1440"},
  {q:"A sum becomes Rs.9261 in 3 years at 5% CI. Principal is:", options:["Rs.8000","Rs.8500","Rs.9000","Rs.7500"], answer:0, hint:"P(1.05)³ = 9261", exp:"8000"},
  {q:"Difference of CI and SI on Rs.12000 at 10% for 2 years is:", options:["Rs.120","Rs.100","Rs.150","Rs.80"], answer:0, hint:"P(R/100)²", exp:"120"},
  {q:"SI on Rs.9000 at 5% for 4 years is:", options:["Rs.1800","Rs.1500","Rs.2000","Rs.1600"], answer:0, hint:"PRT/100", exp:"1800"},
  {q:"CI on Rs.25000 at 8% for 2 years is:", options:["Rs.4160","Rs.4000","Rs.4500","Rs.4200"], answer:0, hint:"P[(1.08)² – 1]", exp:"4160"},
  {q:"A sum doubles in 4 years at SI. Rate is:", options:["25%","20%","15%","30%"], answer:0, hint:"R = 100/T", exp:"25%"},
  {q:"If SI for 3 years is Rs.720 and rate 8%, Principal is:", options:["Rs.3000","Rs.2500","Rs.3500","Rs.4000"], answer:0, hint:"P = SI×100/(RT)", exp:"3000"},
  {q:"A sum of Rs.16000 becomes Rs.18522 in 2 years at CI. Rate is:", options:["7.5%","8%","10%","6%"], answer:0, hint:"(1+R/100)² = 1.157625", exp:"7.5%"},
  {q:"SI on a certain sum at 9% for 4 years is Rs.1440. Sum is:", options:["Rs.4000","Rs.3500","Rs.5000","Rs.4500"], answer:0, hint:"P = SI×100/(RT)", exp:"4000"},
  {q:"CI on Rs.20000 for 2 years at 15% is:", options:["Rs.6450","Rs.6000","Rs.7000","Rs.6500"], answer:0, hint:"20000×(1.15)² – 20000", exp:"6450"},
  {q:"Difference between CI and SI on Rs.6000 at 5% for 2 years is:", options:["Rs.15","Rs.20","Rs.10","Rs.25"], answer:0, hint:"P(R/100)²", exp:"15"},
  {q:"A sum becomes 8 times in 6 years at CI. Rate is:", options:["approx 41.4%","50%","40%","30%"], answer:0, hint:"(1+R/100)⁶ = 8", exp:"≈41.4%"},
  {q:"SI on Rs.7200 for 2 years at 6.25% is:", options:["Rs.900","Rs.800","Rs.1000","Rs.850"], answer:0, hint:"PRT/100", exp:"900"},
  {q:"A sum of Rs.10000 at 10% CI becomes Rs.13310 in:", options:["3 years","2 years","4 years","5 years"], answer:0, hint:"Check (1.1)ⁿ", exp:"3 years"},
  {q:"If CI for 2 years is Rs.630 and SI for 2 years is Rs.600, Principal is:", options:["Rs.6000","Rs.5000","Rs.7000","Rs.5500"], answer:0, hint:"Diff = 30 = P(R/100)²", exp:"6000"},
  {q:"A sum triples in 8 years at SI. Rate is:", options:["25%","20%","15%","30%"], answer:0, hint:"2P = PRT/100", exp:"25%"},
  {q:"CI on Rs.4000 at 10% for 1 year compounded half-yearly is:", options:["Rs.410","Rs.400","Rs.420","Rs.430"], answer:0, hint:"2 periods at 5%", exp:"410"},
  {q:"SI on Rs.5600 at 7.5% for 3 years is:", options:["Rs.1260","Rs.1200","Rs.1300","Rs.1400"], answer:0, hint:"PRT/100", exp:"1260"},
  {q:"A sum of Rs.12000 becomes Rs.14520 in 2 years at CI. Rate is:", options:["10%","8%","12%","9%"], answer:0, hint:"(1+R/100)² = 1.21", exp:"10%"},
  {q:"Difference of CI and SI on Rs.25000 at 8% for 2 years is:", options:["Rs.160","Rs.200","Rs.100","Rs.150"], answer:0, hint:"P(R/100)²", exp:"160"}
];

let questions=[],current=0,score=0,userAnswers=[],timerInterval=null,timeLeft=80,isPaused=false;
const quizArea=document.getElementById('quizArea'),timerEl=document.getElementById('timer'),progressBar=document.getElementById('progressBar'),pauseBtn=document.getElementById('pauseBtn');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffleQuestionOptions(question){const correctText=question.options[question.answer];const optionIndices=shuffle(question.options.map((_,i)=>i));const newOptions=optionIndices.map(i=>question.options[i]);const newAnswer=newOptions.indexOf(correctText);return{...question,options:newOptions,answer:newAnswer}}
function startQuiz(){const shuffledQuestions=shuffle([...allQuestions]);questions=shuffledQuestions.map(shuffleQuestionOptions);current=0;score=0;userAnswers=[];loadQuestion()}
function startTimer(){timeLeft=80;timerEl.textContent=timeLeft;timerEl.className='timer-box';clearInterval(timerInterval);timerInterval=setInterval(()=>{if(isPaused)return;timeLeft--;timerEl.textContent=timeLeft;if(timeLeft<=15)timerEl.classList.add('danger');else if(timeLeft<=30)timerEl.classList.add('warning');if(timeLeft<=0){clearInterval(timerInterval);selectOption(-1);setTimeout(nextQuestion,700)}},1000)}
function togglePause(){isPaused=!isPaused;pauseBtn.textContent=isPaused?'Resume':'Pause'}
function loadQuestion(){if(current>=questions.length){showResult();return}const q=questions[current];progressBar.style.width=(current/questions.length*100)+'%';let hintHTML=q.hint?`<div class="hint-box"><details><summary>💡 Formula / Hint</summary><div class="hint-content">${q.hint}</div></details></div>`:'';quizArea.innerHTML=`<div class="card"><div class="q-meta">Question ${current+1} of ${questions.length}</div><div class="question">${q.q}</div>${hintHTML}<div class="options">${q.options.map((opt,i)=>`<div class="option" onclick="selectOption(${i})" id="opt${i}">${String.fromCharCode(97+i)}) ${opt}</div>`).join('')}</div><div class="btn-row"><button class="action btn-next" id="nextBtn" disabled onclick="nextQuestion()">Next →</button></div></div>`;startTimer();isPaused=false;pauseBtn.textContent='Pause'}
function selectOption(idx){if(userAnswers[current]!==undefined)return;userAnswers[current]=idx;clearInterval(timerInterval);const q=questions[current];document.querySelectorAll('.option').forEach((el,i)=>{el.style.pointerEvents='none';if(i===q.answer)el.classList.add('correct');if(i===idx&&idx!==q.answer)el.classList.add('incorrect');if(i===idx)el.classList.add('selected')});if(idx===q.answer)score++;document.getElementById('nextBtn').disabled=false}
function nextQuestion(){current++;loadQuestion()}
function showResult(){clearInterval(timerInterval);progressBar.style.width='100%';timerEl.textContent='✓';timerEl.className='timer-box';let reviewHTML='';questions.forEach((q,i)=>{const ua=userAnswers[i];const isCorrect=ua===q.answer;reviewHTML+=`<div class="review-item ${isCorrect?'correct':'incorrect'}"><div class="status ${isCorrect?'correct':'incorrect'}">${isCorrect?'✓ Correct':'✗ Incorrect'}</div><div><strong>Q${i+1}.</strong> ${q.q}</div><div style="margin-top:6px">Your answer: <em>${ua===-1||ua===undefined?'Timed out':q.options[ua]}</em></div><div>Correct: <strong>${q.options[q.answer]}</strong></div><div style="font-size:.88rem;color:#94a3b8;margin-top:4px">${q.exp||''}</div></div>`});quizArea.innerHTML=`<div class="card result"><h2>Set 4 Completed!</h2><div class="score">${score}/${questions.length}</div><p>${Math.round(score/questions.length*100)}%</p><div class="review"><h3>Detailed Review</h3>${reviewHTML}</div><button class="action btn-next" style="margin-top:24px" onclick="location.reload()">🔄 Restart</button></div>`}
startQuiz();
</script>
</body>
</html>
